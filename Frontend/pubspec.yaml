name: trimmy_mobile
description: "Trimmy — Unified Salon Management & Marketplace Mobile App (iOS & Android)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  provider: ^6.1.2
  
  # Networking & HTTP
  http: ^1.2.1
  
  # Icons & Fonts
  cupertino_icons: ^1.0.8
  
  # Local Storage & Preferences
  shared_preferences: ^2.2.3
  
  # Date formatting & localization
  intl: ^0.19.0
  
  # QR Code Generation for Client Pass & Check-in
  qr_flutter: ^4.1.0
  
  # URL Launcher for Phone & WhatsApp
  url_launcher: ^6.3.0
  
  # Geolocation & GPS Runtime Permissions (MOB-02)
  geolocator: ^12.0.0
  
  # Animations & UI Flourishes
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
