name: Trimmy Continuous Integration & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web-app-quality-gate:
    name: Web App Verification (Next.js 16 Turbopack)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/web-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/web-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript & Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://trimmy.it
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: gestionale-saloni

  mobile-app-quality-gate:
    name: Mobile App Verification (Flutter Android & iOS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze

      - name: Run Flutter Unit Tests
        run: flutter test

      - name: Verify Android Debug APK Build
        run: flutter build apk --debug
